[project]
name = "swipay-wl-compare"
version = "1.3.0"
requires-python = ">=3.13"
dependencies = [
    "fpdf2>=2.8.7",
    "openpyxl>=3.1",
    "pandas>=3.0",
    "pyxlsb>=1.0",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
